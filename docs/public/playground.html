<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@neutro/form — Playground</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg0:#0d1117; --bg1:#161b22; --bg2:#21262d; --bg3:#2d333b;
      --border:#30363d; --focus:#58a6ff;
      --t0:#e6edf3; --t1:#b1bac4; --t2:#8b949e;
      --blue:#58a6ff; --green:#3fb950; --red:#f85149; --yellow:#d29922; --purple:#a371f7;
      --hdr:52px; --tabs:42px; --foot:52px; --side:214px; --perf:218px;
    }
    html,body{height:100%;overflow:hidden;background:var(--bg0);color:var(--t0);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;
      font-size:14px;line-height:1.5;}

    /* ── header */
    .hdr{height:var(--hdr);background:var(--bg1);border-bottom:1px solid var(--border);
      display:flex;align-items:center;padding:0 20px;gap:12px;}
    .hdr-logo{font-size:15px;font-weight:700;color:var(--blue);font-family:'SF Mono',Menlo,monospace;}
    .hdr-tag{font-size:12px;color:var(--t2);border-left:1px solid var(--border);padding-left:12px;}
    .hdr-right{margin-left:auto;display:flex;gap:8px;align-items:center;}
    .chip{background:var(--bg2);border:1px solid var(--border);color:var(--t1);
      font-size:11px;padding:3px 10px;border-radius:20px;font-family:'SF Mono',Menlo,monospace;
      text-decoration:none;transition:all .15s;}
    .chip:hover{border-color:var(--blue);color:var(--blue);}

    /* ── framework tabs */
    .fw-tabs{height:var(--tabs);background:var(--bg1);border-bottom:1px solid var(--border);
      display:flex;align-items:stretch;padding:0 12px;gap:2px;overflow-x:auto;}
    .fw-tabs::-webkit-scrollbar{display:none;}
    .fw-tab{padding:0 16px;font-size:13px;font-weight:500;color:var(--t2);cursor:pointer;
      border:none;background:transparent;border-bottom:2px solid transparent;
      display:flex;align-items:center;gap:6px;white-space:nowrap;transition:color .15s;}
    .fw-tab:hover{color:var(--t0);}
    .fw-tab.active{color:var(--t0);border-bottom-color:var(--blue);}

    /* ── workspace grid */
    .workspace{display:grid;
      grid-template-columns:var(--side) 1fr 1fr var(--perf);
      grid-template-rows:1fr;
      height:calc(100vh - var(--hdr) - var(--tabs) - var(--foot));overflow:hidden;}
    .workspace.hide-perf{grid-template-columns:var(--side) 1fr 1fr;}

    /* ── sidebar */
    .sidebar{background:var(--bg1);border-right:1px solid var(--border);
      overflow-y:auto;padding:6px 0;}
    .sidebar::-webkit-scrollbar{width:4px;}
    .sidebar::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    .sidebar-label{font-size:10px;font-weight:700;letter-spacing:.08em;
      text-transform:uppercase;color:var(--t2);padding:8px 14px 4px;}
    .step-item{display:flex;align-items:center;gap:8px;padding:5px 14px;
      cursor:pointer;font-size:12px;color:var(--t1);
      border-left:2px solid transparent;transition:all .1s;}
    .step-item:hover{background:var(--bg2);color:var(--t0);}
    .step-item.active{background:var(--bg2);color:var(--blue);border-left-color:var(--blue);}
    .step-num{min-width:18px;height:18px;background:var(--bg2);border:1px solid var(--border);
      border-radius:50%;display:flex;align-items:center;justify-content:center;
      font-size:9px;font-family:'SF Mono',Menlo,monospace;font-weight:700;color:var(--t2);}
    .step-item.active .step-num{background:var(--blue);border-color:var(--blue);color:#fff;}

    /* ── code panel */
    .code-panel{background:var(--bg1);border-right:1px solid var(--border);
      display:flex;flex-direction:column;overflow:hidden;}
    .panel-hdr{padding:7px 14px;border-bottom:1px solid var(--border);
      font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
      color:var(--t2);display:flex;align-items:center;gap:8px;background:var(--bg0);flex-shrink:0;}
    .panel-badge{background:var(--bg2);border:1px solid var(--border);
      padding:1px 7px;border-radius:10px;font-size:10px;}
    .step-hdr{padding:11px 16px 0;flex-shrink:0;}
    .step-hdr h2{font-size:14px;font-weight:600;color:var(--t0);}
    .step-hdr p{font-size:12px;color:var(--t2);margin-top:3px;padding-bottom:10px;
      border-bottom:1px solid var(--border);line-height:1.6;}
    .code-scroll{flex:1;overflow:auto;}
    .code-scroll::-webkit-scrollbar{width:6px;height:6px;}
    .code-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
    .code-scroll pre{margin:0;padding:14px 16px;font-size:12.5px;line-height:1.72;min-height:100%;}
    .code-scroll pre code{background:transparent!important;padding:0!important;}

    /* ── demo panel */
    .demo-panel{background:var(--bg0);display:flex;flex-direction:column;overflow:hidden;}
    .demo-area{flex:1;overflow-y:auto;padding:16px;}
    .demo-area::-webkit-scrollbar{width:4px;}
    .demo-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    .demo-iframe{width:100%;height:100%;border:none;}

    /* ── perf panel */
    .perf-panel{background:var(--bg1);border-left:1px solid var(--border);
      overflow-y:auto;display:flex;flex-direction:column;}
    .perf-panel::-webkit-scrollbar{width:4px;}
    .perf-panel::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
    .perf-row{padding:10px 12px;border-bottom:1px solid var(--border);}
    .perf-lbl{font-size:10px;font-weight:700;letter-spacing:.05em;
      text-transform:uppercase;color:var(--t2);margin-bottom:2px;}
    .perf-val{font-size:22px;font-weight:700;font-family:'SF Mono',Menlo,monospace;color:var(--blue);}
    .perf-val.sm{font-size:12px;word-break:break-all;}
    .perf-sub{font-size:10px;color:var(--t2);margin-top:1px;}
    .perf-path-item{display:flex;justify-content:space-between;
      font-size:10px;font-family:'SF Mono',Menlo,monospace;color:var(--t1);padding:2px 0;}
    .perf-path-item em{color:var(--blue);font-style:normal;}

    /* ── footer nav */
    .foot{height:var(--foot);background:var(--bg1);border-top:1px solid var(--border);
      display:flex;align-items:center;justify-content:center;gap:16px;padding:0 20px;}
    .nav-btn{padding:7px 20px;border-radius:6px;border:1px solid var(--border);
      background:var(--bg2);color:var(--t0);font-size:13px;cursor:pointer;transition:all .15s;}
    .nav-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue);}
    .nav-btn:disabled{opacity:.35;cursor:not-allowed;}
    .step-ctr{font-size:12px;color:var(--t2);min-width:88px;text-align:center;
      font-family:'SF Mono',Menlo,monospace;}

    /* ── demo-area components */
    .df{max-width:360px;}
    .fld{margin-bottom:13px;}
    .fld label{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;
      text-transform:uppercase;color:var(--t2);margin-bottom:3px;}
    .fld input,.fld select,.fld textarea{width:100%;background:var(--bg2);
      border:1px solid var(--border);color:var(--t0);border-radius:6px;
      padding:7px 10px;font-size:13px;outline:none;transition:border-color .15s;font-family:inherit;}
    .fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--focus);}
    .ferr{color:var(--red);font-size:11px;margin-top:3px;min-height:15px;}
    .fok{color:var(--green);font-size:11px;margin-top:3px;}
    .fhint{color:var(--t2);font-size:11px;margin-top:3px;}

    .btn{padding:7px 16px;border-radius:6px;border:1px solid var(--border);
      background:var(--bg2);color:var(--t0);font-size:13px;cursor:pointer;transition:all .15s;}
    .btn:hover:not(:disabled){background:var(--bg3);border-color:var(--t2);}
    .btn.primary{background:#1f6feb;border-color:#1f6feb;color:#fff;}
    .btn.primary:hover:not(:disabled){background:var(--blue);border-color:var(--blue);}
    .btn.danger{border-color:var(--red);color:var(--red);}
    .btn.danger:hover:not(:disabled){background:rgba(248,81,73,.1);}
    .btn.sm{padding:4px 10px;font-size:12px;}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}

    .box{background:var(--bg1);border:1px solid var(--border);border-radius:8px;
      padding:11px 14px;font-size:11.5px;font-family:'SF Mono',Menlo,monospace;
      white-space:pre;overflow:auto;max-height:200px;line-height:1.6;}
    .box::-webkit-scrollbar{width:4px;height:4px;}
    .box::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}

    .sec{font-size:10px;font-weight:700;letter-spacing:.06em;
      text-transform:uppercase;color:var(--t2);margin-bottom:7px;}
    .hr{border:none;border-top:1px solid var(--border);margin:12px 0;}

    .badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
    .badge.g{background:rgba(63,185,80,.15);color:var(--green);}
    .badge.r{background:rgba(248,81,73,.15);color:var(--red);}
    .badge.b{background:rgba(88,166,255,.15);color:var(--blue);}
    .badge.y{background:rgba(210,153,34,.15);color:var(--yellow);}

    .alert{padding:9px 13px;border-radius:6px;font-size:13px;margin-top:10px;line-height:1.5;}
    .alert.ok{background:rgba(63,185,80,.1);border:1px solid rgba(63,185,80,.3);color:var(--green);}
    .alert.err{background:rgba(248,81,73,.1);border:1px solid rgba(248,81,73,.3);color:var(--red);}
    .alert.info{background:rgba(88,166,255,.1);border:1px solid rgba(88,166,255,.3);color:var(--blue);}

    .spin{width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--blue);
      border-radius:50%;display:inline-block;animation:sp .6s linear infinite;vertical-align:middle;}
    @keyframes sp{to{transform:rotate(360deg);}}

    .arr-item{display:flex;align-items:center;gap:6px;background:var(--bg1);
      border:1px solid var(--border);border-radius:6px;padding:7px 10px;margin-bottom:6px;}
    .arr-item input{flex:1;background:var(--bg2);border:1px solid var(--border);
      color:var(--t0);border-radius:4px;padding:4px 8px;font-size:12px;outline:none;}
    .arr-item input:focus{border-color:var(--focus);}

    .wiz-steps{display:flex;margin-bottom:18px;}
    .wiz-step{flex:1;text-align:center;padding:7px 4px;font-size:11px;font-weight:600;
      color:var(--t2);border-bottom:2px solid var(--border);}
    .wiz-step.active{color:var(--blue);border-bottom-color:var(--blue);}
    .wiz-step.done{color:var(--green);border-bottom-color:var(--green);}

    .sb-link{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;
      background:var(--bg2);border:1px solid var(--border);border-radius:6px;
      color:var(--t0);text-decoration:none;font-size:13px;margin-top:12px;transition:all .15s;}
    .sb-link:hover{border-color:var(--blue);color:var(--blue);}
  </style>
</head>
<body>

<header class="hdr">
  <span class="hdr-logo">@neutro/form</span>
  <span class="hdr-tag">Playground &amp; Tutorial</span>
  <div class="hdr-right">
    <a class="chip" href="https://www.npmjs.com/package/@neutro/form" target="_blank">npm</a>
    <a class="chip" href="https://github.com/neutro-web/form" target="_blank">GitHub</a>
  </div>
</header>

<nav class="fw-tabs" id="fwTabs"></nav>

<div class="workspace" id="workspace">
  <aside class="sidebar" id="sidebar"></aside>
  <section class="code-panel">
    <div class="panel-hdr">
      <span>Code</span>
      <span class="panel-badge" id="codeLang">javascript</span>
    </div>
    <div class="step-hdr" id="stepHdr">
      <h2 id="stepTitle"></h2>
      <p id="stepDesc"></p>
    </div>
    <div class="code-scroll">
      <pre><code id="codeEl" class="language-javascript"></code></pre>
    </div>
  </section>
  <section class="demo-panel">
    <div class="panel-hdr"><span id="demoLabel">Demo</span></div>
    <div class="demo-area" id="demoArea"></div>
  </section>
  <aside class="perf-panel" id="perfPanel">
    <div class="panel-hdr">Engine Internals</div>
    <div id="perfContent"></div>
  </aside>
</div>

<footer class="foot">
  <button class="nav-btn" id="prevBtn">← Prev</button>
  <span class="step-ctr" id="stepCtr"></span>
  <button class="nav-btn" id="nextBtn">Next →</button>
</footer>

<script type="module">
import { createForm as _createForm, localStorageAdapter } from './form-core.esm.js';
let createForm = _createForm;

// Dynamic base URL — works on localhost AND GitHub Pages
const BASE_URL = window.location.origin + (window.location.pathname.includes('/form') ? '/form/' : '/');

// ─── IFRAME STYLE SHEET (injected into framework iframes) ────────────────────
const IFRAME_CSS = `
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;padding:16px;font-size:13px;line-height:1.5;}
input,select,textarea{width:100%;background:#21262d;border:1px solid #30363d;color:#e6edf3;border-radius:6px;padding:6px 10px;font-size:13px;outline:none;transition:border-color .15s;font-family:inherit;}
input:focus,select:focus{border-color:#58a6ff;}
button{padding:6px 14px;border-radius:6px;border:1px solid #30363d;background:#21262d;color:#e6edf3;font-size:12px;cursor:pointer;transition:all .15s;}
button:hover:not(:disabled){border-color:#58a6ff;color:#58a6ff;}
button.primary{background:#1f6feb;border-color:#1f6feb;color:#fff;}
button.primary:hover:not(:disabled){background:#388bfd;}
button.danger{border-color:#f85149;color:#f85149;}
.field{margin-bottom:12px;}
label{display:block;font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:#8b949e;margin-bottom:3px;}
.err{color:#f85149;font-size:11px;margin-top:3px;min-height:15px;}
.ok{color:#3fb950;font-size:11px;margin-top:3px;}
.hint{color:#8b949e;font-size:11px;margin-top:3px;}
.box{background:#161b22;border:1px solid #30363d;border-radius:6px;padding:10px;font-size:11px;font-family:'SF Mono',Menlo,monospace;white-space:pre;overflow:auto;max-height:180px;line-height:1.6;margin-top:8px;}
.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;}
.badge{display:inline-block;padding:2px 8px;border-radius:20px;font-size:11px;font-weight:700;}
.g{background:rgba(63,185,80,.15);color:#3fb950;}
.r{background:rgba(248,81,73,.15);color:#f85149;}
.b{background:rgba(88,166,255,.15);color:#58a6ff;}
hr{border:none;border-top:1px solid #30363d;margin:12px 0;}
.spin{width:12px;height:12px;border:2px solid #30363d;border-top-color:#58a6ff;border-radius:50%;display:inline-block;animation:sp .6s linear infinite;vertical-align:middle;}
@keyframes sp{to{transform:rotate(360deg);}}
.arr{display:flex;align-items:center;gap:6px;background:#161b22;border:1px solid #30363d;border-radius:6px;padding:7px 9px;margin-bottom:5px;}
.arr input{background:#21262d;border:1px solid #30363d;flex:1;}
`;

// ─── IFRAME BUILDER HELPERS ───────────────────────────────────────────────────
function makeReactIframe(jsx, extraSetup = '') {
  return `<!DOCTYPE html><html><head><style>${IFRAME_CSS}<\/style><\/head><body>
<div id="root"><\/div>
<script src="https://unpkg.com/@babel/standalone@7.24.4/babel.min.js"><\/script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js"><\/script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"><\/script>
<script type="module">
import { createForm } from '${BASE_URL}form-core.esm.js';
window.createForm = createForm;
<\/script>
<script>
function useForm(form) {
  const [s, set] = React.useState(() => form.getState());
  React.useEffect(() => form.subscribe(set), []);
  return s;
}
function useField(form, path) {
  const [val, setVal] = React.useState(() => form.get(path));
  const [fs, setFs] = React.useState({});
  React.useEffect(() => form.subscribeToPath(path, (v, f) => { setVal(v); setFs(f); }), [path]);
  return [val, fs, v => form.set(path, v, { touch: true, validate: true })];
}
${extraSetup}
<\/script>
<script type="text/babel" data-presets="react">
${jsx}
ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
<\/script>
<\/body><\/html>`;
}

function makeVueIframe(setup, template) {
  return `<!DOCTYPE html><html><head><style>${IFRAME_CSS}<\/style><\/head><body>
<div id="app"><\/div>
<script src="https://unpkg.com/vue@3.4.31/dist/vue.global.prod.js"><\/script>
<script type="module">
import { createForm } from '${BASE_URL}form-core.esm.js';
const { createApp, ref, shallowRef, computed, onUnmounted, readonly } = Vue;
function useVueForm(form) {
  const state = shallowRef(form.getState());
  const unsub = form.subscribe(s => { state.value = Object.assign({}, s); });
  onUnmounted(unsub);
  return readonly(state);
}
function useVueField(form, path) {
  const value = ref(form.get(path));
  const error = ref(undefined);
  const touched = ref(false);
  const unsub = form.subscribeToPath(path, (v, fs) => { value.value = v; error.value = fs.error; touched.value = !!fs.touched; });
  onUnmounted(unsub);
  return { value, error, touched };
}
createApp({
  setup() { ${setup} },
  template: \`${template}\`
}).mount('#app');
<\/script><\/body><\/html>`;
}

// ─── PERF WRAPPER ────────────────────────────────────────────────────────────
// Augments a real engine form instance with lightweight perf tracking.
function withPerf(form) {
  let _n = 0, _ms = null, _epoch = 0, _batchDepth = 0;
  const _pathCounts = {};

  const origSub = form.subscribe.bind(form);
  const origPath = form.subscribeToPath.bind(form);
  const origValidate = form.validate.bind(form);
  const origBatch = form.batch.bind(form);

  form.subscribe = fn => {
    const wrapped = s => { _n++; fn(s); };
    return origSub(wrapped);
  };
  form.subscribeToPath = (path, fn) => {
    _pathCounts[path] = (_pathCounts[path] || 0) + 1;
    const wrapped = (v, fs) => { _n++; fn(v, fs); };
    const unsub = origPath(path, wrapped);
    return () => { _pathCounts[path] = Math.max(0, (_pathCounts[path] || 1) - 1); if (!_pathCounts[path]) delete _pathCounts[path]; unsub(); };
  };
  form.validate = paths => {
    const t = performance.now();
    _epoch++;
    return origValidate(paths).then(r => { _ms = performance.now() - t; return r; });
  };
  form.batch = fn => {
    _batchDepth++;
    try { origBatch(fn); } finally { _batchDepth--; }
  };

  form.perf = {
    get notifications() { return _n; },
    get lastValidationMs() { return _ms; },
    get epoch() { return _epoch; },
    get batchActive() { return _batchDepth > 0; },
    get subscriberCount() { return Object.values(_pathCounts).reduce((a, b) => a + b, 0); },
    get pathMap() { return Object.assign({}, _pathCounts); },
    reset() { _n = 0; _ms = null; },
  };
  return form;
}

// ─── SVELTE IN-BROWSER COMPILER ──────────────────────────────────────────────
// JSON-encode source so script-end-tags inside it can't close the srcdoc block.
// Rewrite svelte/* bare specifiers in the compiled output to absolute esm.sh URLs
// so dynamic blob-URL imports can resolve them (importmaps don't apply to blob URLs).
function makeSvelteIframe(svelteSource) {
  const jsonSrc = JSON.stringify(svelteSource).replace(/<\//g, '<\\/');
  return `<!DOCTYPE html><html>
<head>
<style>${IFRAME_CSS}<\/style>
<\/head><body>
<div id="root"><\/div>
<script type="module">
import { compile } from 'https://esm.sh/svelte@4.1.2/compiler';
import { createForm } from '${BASE_URL}form-core.esm.js';
window.createForm = createForm;
const src = ${jsonSrc};
try {
  const { js } = compile(src, { filename:'Demo.svelte', generate:'dom', format:'esm', dev:false });
  const code = js.code
    .replace(/import\\s*\\{[^}]+\\}\\s*from\\s*['"]svelte\\/internal\\/disclose-version['"]\\s*;?\\n?/g,
      function(m) { var n=m.match(/\\{[^}]+\\}/); return 'const '+(n?n[0]:'{}')+' = {disclose_version:function(){},PUBLIC_VERSION:"4"};\\n'; })
    .replace(/import\\s*['"]svelte\\/internal\\/disclose-version['"]\\s*;?\\n?/g, '')
    .replace(/from ['"]svelte(\\/[a-z_0-9/-]+)?['"]/g, function(m, sub) {
      return "from 'https://esm.sh/svelte@4.1.2" + (sub || '') + "'";
    });
  const blob = new Blob([code], { type:'text/javascript' });
  const { default: Component } = await import(URL.createObjectURL(blob));
  new Component({ target: document.getElementById('root') });
} catch(e) {
  document.getElementById('root').innerHTML = '<pre style="color:#f85149;font-size:11px;">' + e.message + '<\/pre>';
}
<\/script><\/body><\/html>`;
}

// ─── STACKBLITZ POST HELPER ───────────────────────────────────────────────────
function openStackBlitz(project) {
  const form = document.createElement('form');
  form.method = 'post';
  form.action = 'https://stackblitz.com/run';
  form.target = '_blank';
  form.style.display = 'none';
  const add = function(name, value) {
    const inp = document.createElement('input');
    inp.type = 'hidden'; inp.name = name; inp.value = value;
    form.appendChild(inp);
  };
  add('project[title]', project.title);
  add('project[description]', project.description || '');
  add('project[template]', project.template);
  Object.keys(project.files).forEach(function(path) { add('project[files][' + path + ']', project.files[path]); });
  document.body.appendChild(form);
  form.submit();
  document.body.removeChild(form);

    const taken = await checkUsernameTaken(name, signal);

// • Cancels the previous request via AbortSignal when a new one starts
// • Discards results from stale epochs if async calls arrive out of order`,

run(el) {
  // Fake "taken" names for the demo
  const TAKEN = new Set(['admin', 'alice', 'bob', 'test', 'user', 'root', 'john']);

  const form = createForm({

      const name = (values.username || '').toLowerCase().trim();
      if (!name || name.length < 3) return {};
      // Simulate network delay
      await new Promise(r => setTimeout(r, 600));
      if (signal.aborted) return {};

    },
  });

      </div>

    </div>`;

  const inp = document.getElementById('i-un');

run(el) {
  const form = createForm({
    initialValues: { title: '', body: '', tags: '' },
    rules: {
      title: ['required', { minLength: 5 }],
      body: ['required', { minLength: 20 }],
    },
    validator(values) {
      const errors = {};
      if (values.tags && values.tags.trim()) {
        const tags = values.tags.split(',').map(t => t.trim());
        const invalid = tags.some(t => t === '' || !/^[a-z0-9_-]+$/i.test(t));
        if (invalid) errors.tags = 'Use comma-separated tags — e.g. "react, vue, angular"';
      }
      return errors;
    },
  });

  el.innerHTML = `
    <div class="df">
      <form id="the-form">
        <div class="fld"><label>Title</label>
          <input id="i-title" placeholder="at least 5 chars" />
          <div class="ferr" id="e-title"></div>
        </div>
        <div class="fld"><label>Body</label>
          <textarea id="i-body" rows="3" placeholder="at least 20 chars"></textarea>
          <div class="ferr" id="e-body"></div>
        </div>
        <div class="fld"><label>Tags</label>
          <input id="i-tags" placeholder="react, vue, angular" />
          <div class="ferr" id="e-tags"></div>
          <div class="fhint">comma-separated · letters, digits, hyphens only</div>
        </div>
        <div class="btn-row">
          <button type="submit" class="btn primary" id="sub-btn">Post</button>
        </div>
        <div id="spin-row" style="display:none;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--t2);">
          <div class="spin"></div> Submitting…
        </div>
      </form>
      <div id="msg" class="alert" style="display:none;margin-top:10px;"></div>
    </div>`;

  [['i-title','title'],['i-body','body'],['i-tags','tags']].forEach(([id,path]) => {
    document.getElementById(id).addEventListener('input', e =>
      form.set(path, e.target.value, {touch:true, validate:true}));
  });
  ['title','body','tags'].forEach(path => {
    form.subscribeToPath(path, (_, fs) => {
      document.getElementById('e-' + path).textContent = fs.touched && fs.error ? fs.error : '';
    });
  });

  form.subscribe(s => {
    document.getElementById('sub-btn').disabled = s.isSubmitting;
    document.getElementById('spin-row').style.display = s.isSubmitting ? 'flex' : 'none';
  });

  document.getElementById('the-form').addEventListener('submit', form.handleSubmit(
    async values => {
      await new Promise(r => setTimeout(r, 1200));
      const msg = document.getElementById('msg');
      msg.className = 'alert ok';
      msg.textContent = 'Posted! Title: "' + values.title + '"';
      msg.style.display = 'block';
    },
    errors => {
      const msg = document.getElementById('msg');
      msg.className = 'alert err';
      msg.textContent = 'Validation failed: ' + Object.keys(errors).join(', ');
      msg.style.display = 'block';
      // Force-show field-level errors (bypass touched gate on submit)
      ['title','body','tags'].forEach(p => {
        const errEl = document.getElementById('e-' + p);
        if (errEl) errEl.textContent = errors[p] || '';
      });
    }
  ));

  return form;
}
},

run(el) {

    if (userErr)  userErr.textContent  = ((submitted || state.touched.username) && state.errors.username) ? state.errors.username : '';
    if (log) {

    <div id="vm-log" class="box" style="margin-top:.75rem;min-height:2rem"></div>
  `;

  const log = el.querySelector('#vm-log');

  const pathUnsubs = modes.map(mode => {
    form.connect(mode, el.querySelector(`#vm-${mode}`));
    return form.subscribeToPath(mode, (_, { error }) => {
      el.querySelector(`#vm-${mode}-err`).textContent = error ?? '';
    });
  });

  const globalUnsub = form.subscribe(state => {
    log.textContent = 'errors: ' + JSON.stringify(state.errors);
  });

  el.querySelector('#vm-submit').addEventListener('click', () => {
    form.submit(() => { log.textContent = 'Valid! ✓'; });
  });

  el._cleanup = () => { pathUnsubs.forEach(u => u()); globalUnsub(); };
  return form;
},
},

// ── Step 17c ────────────────────────────────────────────────────────────────
{
title: 'isValid — Validity State',
desc: 'state.isValid is a three-value flag: null (not yet validated), true (last full validate() passed), false (errors exist). It is set by form.validate() and form.submit() — scoped validate([path]) does not change it. form.reset() resets it back to null.',
code: `const form = createForm({
  initialValues: { email: '' },
  rules: { email: ['required', 'email'] },
});

// Initial: null — not yet validated
console.log(form.getState().isValid); // null

await form.validate();                // full validation
// Invalid: false — errors exist
console.log(form.getState().isValid); // false

form.set('email', 'ok@test.com');
await form.validate();
// Valid: true — no errors
console.log(form.getState().isValid); // true

form.reset();
console.log(form.getState().isValid); // null — reset to null`,

run(el) {
  const form = createForm({
    initialValues: { email: '' },
    rules: { email: ['required', 'email'] },
  });

  el.innerHTML = `
    <div class="df">
      <div class="fld">
        <label>Email</label>
        <input id="iv-email" placeholder="Enter email…" />
        <div class="ferr" id="iv-err"></div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="iv-validate">Validate</button>
        <button class="btn" id="iv-reset">Reset</button>
      </div>
      <div class="hr"></div>
      <div style="display:flex;align-items:center;gap:8px;margin-top:4px">
        <span style="font-size:12px;color:var(--t2)">state.isValid:</span>
        <span id="iv-badge" style="font-size:13px;font-weight:700;color:var(--t2)">null</span>
      </div>
      <div class="box" style="font-size:12px;margin-top:8px;min-height:2rem" id="iv-log"></div>
    </div>`;

  const emailInp = el.querySelector('#iv-email');
  const errDiv   = el.querySelector('#iv-err');
  const badge    = el.querySelector('#iv-badge');
  const log      = el.querySelector('#iv-log');
  const history  = [];

  const appendLog = msg => {
    history.unshift(msg);
    if (history.length > 6) history.pop();
    log.textContent = history.join('\n');
  };

  emailInp.addEventListener('input', e => form.set('email', e.target.value, { touch: true }));

  const unsub = form.subscribe(state => {
    errDiv.textContent = state.errors.email ?? '';
    const iv = state.isValid;
    if (iv === null)       { badge.textContent = 'null';  badge.style.color = 'var(--t2)'; }
    else if (iv === true)  { badge.textContent = 'true';  badge.style.color = 'var(--green)'; }
    else                   { badge.textContent = 'false'; badge.style.color = 'var(--red)'; }
  });

  el.querySelector('#iv-validate').addEventListener('click', async () => {
    const ok = await form.validate();
    appendLog(`validate() → isValid = ${ok}`);
  });

  el.querySelector('#iv-reset').addEventListener('click', () => {
    form.reset();
    emailInp.value = '';
    appendLog('reset() → isValid = null');
  });

  el._cleanup = () => unsub();
  return form;
},
},

{
title: 'TypeScript Typed Paths',
desc: 'Path&lt;T&gt; gives your IDE full autocomplete over every dot-notation path. GetPathValue&lt;T,P&gt; infers the correct return type for form.get(). SetOptions (touch, validate) controls side-effects on write. ArrayItem&lt;V&gt; extracts the element type from an array path. These features require TypeScript — the playground runs vanilla JS but the types enforce correctness at compile time.',
code: `interface ProfileForm {
  email: string;
  age: number;
  address: { city: string };
  tags: Array<{ label: string }>;
}

const form = createForm<ProfileForm>({
  initialValues: { email: '', age: 0, address: { city: '' }, tags: [] },
});

// Path<T> — all valid dot-notation paths (compile-time)
type AllPaths = Path<ProfileForm>;
// → 'email' | 'age' | 'address' | 'address.city' | 'tags' | 'tags.0' | ...

// Typed reads — return type inferred from path
const email: string = form.get('email');   // ✅
const age: number   = form.get('age');     // ✅

// Typed writes — value type enforced
form.set('email', 'alice@example.com');  // ✅ string
form.set('email', 42);                  // ❌ TypeScript error

// SetOptions — runtime behavior on top of typed write
form.set('email', 'x', { touch: true });    // mark as touched
form.set('email', 'y', { validate: true }); // trigger validation

// Typed array operations
type Tag = ArrayItem<ProfileForm['tags']>; // { label: string }
form.arrayAppend('tags', { label: 'new' });  // ✅
form.arrayAppend('tags', 'string');           // ❌ TypeScript error
`,
run(el) {
  const form = createForm({
    initialValues: { email: '', username: '' },
    validator(values) {
      const errors = {};
      if (values.email && !values.email.includes('@')) errors.email = 'Invalid email — must include @';
      return errors;
    },
  });

  el.innerHTML = `
    <div class="df">
      <div class="fld">
        <label>Email</label>
        <input id="tp-email" placeholder="Enter email..." />
      </div>
      <div class="fld">
        <label>Username</label>
        <input id="tp-username" placeholder="Username..." />
      </div>
      <div class="sec">SetOptions Demo</div>
      <div class="btn-row">
        <button class="btn sm" id="tp-plain" title="form.set('email', value)">set plain</button>
        <button class="btn sm" id="tp-touch" title="form.set('email', value, { touch: true })">set + touch</button>
        <button class="btn sm" id="tp-validate" title="form.set('email', value, { validate: true })">set + validate</button>
      </div>
      <div style="display:flex;gap:12px;flex-wrap:wrap;margin-top:4px">
        <span style="font-size:12px">dirty: <span id="tp-dirty" style="font-weight:600;color:var(--yellow)">—</span></span>
        <span style="font-size:12px">touched: <span id="tp-touched" style="font-weight:600;color:var(--blue)">—</span></span>
        <span style="font-size:12px">error: <span id="tp-error" style="font-weight:600;color:var(--red)">—</span></span>
      </div>
      <div class="hr"></div>
      <div class="sec">Type Inference (TypeScript only)</div>
      <div class="box" style="font-size:12px;white-space:pre">form.get('email')  // &rarr; string
form.get('age')    // &rarr; number

// &cross; TS: form.set('email', 42)
//    Argument of type 'number' is not assignable to 'string'</div>
      <span class="fhint">See <a href="https://neutro-web.github.io/form/guides/typescript" style="color:var(--blue)">TypeScript Guide</a> for full type system docs.</span>
    </div>`;

  const emailInp    = el.querySelector('#tp-email');
  const usernameInp = el.querySelector('#tp-username');
  const dirtyBadge  = el.querySelector('#tp-dirty');
  const touchBadge  = el.querySelector('#tp-touched');
  const errorBadge  = el.querySelector('#tp-error');

  emailInp.addEventListener('input',    e => form.set('email',    e.target.value, { touch: true }));
  usernameInp.addEventListener('input', e => form.set('username', e.target.value, { touch: true }));

  const unsub = form.subscribe(state => {
    emailInp.value    = state.values.email    ?? '';
    usernameInp.value = state.values.username ?? '';
    dirtyBadge.textContent  = state.dirty.email   ? 'true'  : 'false';
    touchBadge.textContent  = state.touched.email ? 'true'  : 'false';
    errorBadge.textContent  = state.errors.email  ?? 'none';
  });

  el.querySelector('#tp-plain').addEventListener('click', () => {
    form.set('email', 'test-no-at');
  });
  el.querySelector('#tp-touch').addEventListener('click', () => {
    form.set('email', 'test-no-at', { touch: true });
  });
  el.querySelector('#tp-validate').addEventListener('click', () => {
    form.set('email', 'test-no-at', { validate: true });
  });

  el._cleanup = () => unsub();
  return form;
},

{
title: 'File Validation Rules',
desc: 'Five built-in rules handle File and FileList inputs: maxFileSize (per-file byte limit), minFileSize, fileTypes (MIME allow-list), maxFiles, and minFiles. Default messages use human-readable sizes ("5.0 MB"). Rules accept an optional message override. All size/type rules are no-ops when the field is empty — combine with required or minFiles: 1 to enforce presence.',
code: `const form = createForm({
  initialValues: { avatar: null, docs: null },
  rules: {
    avatar: [
      { maxFileSize: 2 * 1024 * 1024, message: 'Avatar must be under 2 MB' },
      { fileTypes: ['image/jpeg', 'image/png', 'image/webp'] },
    ],
    docs: [
      { minFiles: 1, message: 'Attach at least one document' },
      { maxFiles: 3 },
      { maxFileSize: 5 * 1024 * 1024 },
    ],
  },
});

// Simulate a File value (duck-typed — no real browser FileList needed)
form.set('avatar', { name: 'photo.gif', size: 3 * 1024 * 1024, type: 'image/gif', lastModified: 0 });
await form.validate();
// → { avatar: "Avatar must be under 2 MB" }   (size) + type mismatch

// Empty FileList → minFiles fires
form.set('docs', { length: 0, item: () => null });
await form.validate();
// → { docs: "Attach at least one document" }
`,
run(el) {
  const MB = 1024 * 1024;
  const form = createForm({
    initialValues: { avatar: null, docs: null },
    rules: {
      avatar: [
        { maxFileSize: 2 * MB, message: 'Avatar must be under 2 MB' },
        { fileTypes: ['image/jpeg', 'image/png', 'image/webp'], message: 'Only JPEG, PNG or WebP allowed' },
      ],
      docs: [
        { minFiles: 1, message: 'Attach at least one document' },
        { maxFiles: 3 },
        { maxFileSize: 5 * MB },
      ],
    },
  });

  el.innerHTML = `
    <div class="df">
      <div class="sec">Avatar (max 2 MB, JPEG/PNG/WebP only)</div>
      <div class="fld">
        <div class="btn-row" style="flex-wrap:wrap;gap:6px">
          <button class="btn sm" id="fv-av-ok">✅ Valid (1 MB PNG)</button>
          <button class="btn sm" id="fv-av-big">❌ Too big (3 MB PNG)</button>
          <button class="btn sm" id="fv-av-type">❌ Wrong type (GIF)</button>
        </div>
        <div class="ferr" id="fv-av-err"></div>
      </div>
      <div class="sec" style="margin-top:8px">Documents (1–3 files, max 5 MB each)</div>
      <div class="fld">
        <div class="btn-row" style="flex-wrap:wrap;gap:6px">
          <button class="btn sm" id="fv-doc-none">❌ No files</button>
          <button class="btn sm" id="fv-doc-one">✅ 1 file</button>
          <button class="btn sm" id="fv-doc-many">❌ 4 files (too many)</button>
          <button class="btn sm" id="fv-doc-big">❌ Oversized file</button>
        </div>
        <div class="ferr" id="fv-doc-err"></div>
      </div>
      <div class="hr"></div>
      <div class="sec">State</div>
      <div class="box" id="fv-state" style="font-size:11px;min-height:60px"></div>
    </div>`;

  function mockFile(name, type, sizeBytes) {
    return { name, size: sizeBytes, type, lastModified: Date.now() };
  }
  function mockFileList(...files) {
    const fl = { length: files.length, item: i => files[i] ?? null };
    files.forEach((f, i) => { fl[i] = f; });
    return fl;
  }

  const unsub = form.subscribe(state => {
    el.querySelector('#fv-av-err').textContent  = state.errors.avatar ?? '';
    el.querySelector('#fv-doc-err').textContent = state.errors.docs   ?? '';
    el.querySelector('#fv-state').textContent =
      'avatar error: ' + (state.errors.avatar ?? 'none') + '\n' +
      'docs error:   ' + (state.errors.docs   ?? 'none');
  });

  async function setAndValidate(path, val) {
    form.set(path, val);
    await form.validate([path]);
  }

  el.querySelector('#fv-av-ok')  .addEventListener('click', () => setAndValidate('avatar', mockFile('photo.png', 'image/png', 1 * MB)));
  el.querySelector('#fv-av-big') .addEventListener('click', () => setAndValidate('avatar', mockFile('big.png',   'image/png', 3 * MB)));
  el.querySelector('#fv-av-type').addEventListener('click', () => setAndValidate('avatar', mockFile('anim.gif',  'image/gif', 0.5 * MB)));

  el.querySelector('#fv-doc-none').addEventListener('click', () => setAndValidate('docs', mockFileList()));
  el.querySelector('#fv-doc-one') .addEventListener('click', () => setAndValidate('docs', mockFileList(mockFile('a.pdf', 'application/pdf', 1 * MB))));
  el.querySelector('#fv-doc-many').addEventListener('click', () => setAndValidate('docs', mockFileList(
    mockFile('a.pdf', 'application/pdf', 1 * MB),
    mockFile('b.pdf', 'application/pdf', 1 * MB),
    mockFile('c.pdf', 'application/pdf', 1 * MB),
    mockFile('d.pdf', 'application/pdf', 1 * MB),
  )));
  el.querySelector('#fv-doc-big').addEventListener('click', () => setAndValidate('docs', mockFileList(mockFile('huge.pdf', 'application/pdf', 8 * MB))));

  el._cleanup = () => unsub();
  return form;
},
},

// ── Demo: watch ──────────────────────────────────────────────────────────────
{
title: 'watch — Targeted Field Observation',
desc: 'Subscribe to one or more field values without subscribing to all form state. The callback fires only when a watched path changes, not on subscription, not when other fields change.',
code: `const form = createForm({

// Watch only email + username
const stop = form.watch(['email', 'username'], ({ email, username }) => {
  console.log('Watched values changed:', { email, username });
});

form.set('email', 'alice@example.com'); // fires callback

stop(); // unsubscribe

run(el) {
  const form = createForm({
    initialValues: { email: '', username: '', password: '' },
  });

  el.innerHTML = `
    <div class="df">
      <div class="sec">Targeted Watch (email + username)</div>
      <div class="fld">
        <label>Email <span class="badge b" style="font-size:9px;vertical-align:middle;">watched</span></label>

        <label>Username <span class="badge b" style="font-size:9px;vertical-align:middle;">watched</span></label>
        <input id="w-user" type="text" placeholder="Your username" />
      </div>
      <div class="fld">
        <label>Password <span class="badge y" style="font-size:9px;vertical-align:middle;">not watched</span></label>
        <input id="w-pass" type="password" placeholder="Won't trigger log" />
      </div>
      <div class="btn-row" style="margin-bottom:12px;">
        <button class="btn primary" id="w-start">Start watching</button>
        <button class="btn danger" id="w-stop" disabled>Stop watching</button>
        <button class="btn sm" id="w-clear">Clear log</button>
      </div>
      <div class="sec">Watch log</div>
      <div class="box" id="w-log" style="max-height:160px;font-size:11px;">(click Start watching to begin…)</div>
    </div>`;

  const log = el.querySelector('#w-log');
  const ts = () => new Date().toLocaleTimeString('en', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });
  let lineCount = 0;
  let stopFn = null;

  const startBtn = el.querySelector('#w-start');
  const stopBtn  = el.querySelector('#w-stop');

  const startWatch = () => {
    stopFn = form.watch(['email', 'username'], ({ email, username }) => {
      lineCount++;
      const entry = `[${ts()}] #${lineCount} email="${email}" username="${username}"`;
      log.textContent = (log.textContent.startsWith('(') ? '' : log.textContent + '\n') + entry;
      log.scrollTop = log.scrollHeight;
    });
    startBtn.disabled = true;
    stopBtn.disabled = false;
    log.textContent += (log.textContent.startsWith('(') ? '' : log.textContent + '\n') + '[watching started]';
    log.textContent = log.textContent.startsWith('(') ? '[watching started]' : log.textContent;
  };

  const stopWatch = () => {
    if (stopFn) { stopFn(); stopFn = null; }
    startBtn.disabled = false;
    stopBtn.disabled = true;
    log.textContent += '\n[watch stopped — further changes will not appear]';
  };

  startBtn.addEventListener('click', startWatch);
  stopBtn.addEventListener('click',  stopWatch);

  const emailInput = el.querySelector('#w-email');
  const userInput  = el.querySelector('#w-user');
  const passInput  = el.querySelector('#w-pass');

  emailInput.addEventListener('input', e => form.set('email', e.target.value));
  userInput.addEventListener('input',  e => form.set('username', e.target.value));
  passInput.addEventListener('input',  e => form.set('password', e.target.value));

  el.querySelector('#w-clear').addEventListener('click', () => {
    log.textContent = stopFn ? '(cleared — watching…)' : '(cleared — click Start watching to begin…)';
    lineCount = 0;
  });

  el._cleanup = () => { if (stopFn) stopFn(); };
  return form;
},
},

{

console.log(form.getState().submissionAttempts);    // 2

run(el) {

// ── Demo: onSubmitSuccess / onSubmitError ────────────────────────────────────
{
title: 'onSubmitSuccess / onSubmitError — Lifecycle Hooks',
desc: 'onSubmitSuccess is called after the submit handler resolves. onSubmitError is called when it rejects — the original error is re-thrown after the hook runs, so you can both react to it and propagate it.',
code: `const form = createForm({
  initialValues: { email: '' },
  rules: { email: ['required', 'email'] },
  onSubmitSuccess: (payload) => {
    console.log('Saved!', payload);
    // analytics.track('form_submit', payload)
  },
  onSubmitError: (error, payload) => {
    console.error('Submit failed:', error.message);
    form.setErrors({ email: 'Server error — try again' });
  },
});

await form.submit(async (payload) => {
  const res = await fetch('/api/save', { method: 'POST', body: JSON.stringify(payload) });
  if (!res.ok) throw new Error('Server error');
});`,

run(el) {
  const ts = () => new Date().toLocaleTimeString('en', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' });

  let form;
  const rebuildForm = (simulateFail) => {
    form = createForm({
      initialValues: { email: '' },
      rules: { email: ['required', 'email'] },
      onSubmitSuccess: (payload) => {
        appendLog('onSubmitSuccess', `payload: ${JSON.stringify(payload)}`, 'g');
      },
      onSubmitError: (error) => {
        appendLog('onSubmitError', `error: "${error.message}"`, 'r');
        form.setErrors({ email: 'Server error — try again' });
      },
    });
    const emailInput = el.querySelector('#se-email');
    if (emailInput) form.set('email', emailInput.value);
  };

  el.innerHTML = `
    <div class="df">
      <div class="sec">Submit Lifecycle Hooks</div>
      <div class="fld">
        <label>Email</label>
        <input id="se-email" type="text" placeholder="user@example.com" />
        <div class="ferr" id="se-email-err"></div>
      </div>
      <div class="fld" style="margin-bottom:10px;">
        <label>Simulate server response</label>
        <div style="display:flex;gap:10px;margin-top:6px;">
          <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--t0);text-transform:none;letter-spacing:0;font-weight:400;">
            <input type="radio" name="se-mode" value="ok" checked /> Success
          </label>
          <label style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--t0);text-transform:none;letter-spacing:0;font-weight:400;">
            <input type="radio" name="se-mode" value="fail" /> Fail (500)
          </label>
        </div>
      </div>
      <div class="btn-row" style="margin-bottom:12px;">

        <button class="btn sm" id="se-clear-log">Clear log</button>
      </div>
      <div class="sec">Event log</div>
      <div class="box" id="se-log" style="max-height:180px;font-size:11px;">(no events yet)</div>
    </div>`;

  const logEl = document.getElementById('se-log');
  let logCount = 0;
  const appendLog = (hook, detail, cls) => {
    logCount++;
    const line = `[${ts()}] #${logCount} ${hook}() — ${detail}`;
    logEl.textContent = (logEl.textContent === '(no events yet)' ? '' : logEl.textContent + '\n') + line;
    logEl.scrollTop = logEl.scrollHeight;
  };

  rebuildForm(false);

  const emailInput = el.querySelector('#se-email');
  emailInput.addEventListener('input', e => {
    form.set('email', e.target.value, { touch: true });
    document.getElementById('se-email-err').textContent = form.getState().errors.email ?? '';
  });

  const unsub = () => {};
  form.subscribe(state => {
    document.getElementById('se-email-err').textContent = state.errors.email ?? '';
  });

  const submitBtn = el.querySelector('#se-submit');
  submitBtn.addEventListener('click', async () => {

        if (mode === 'fail') throw new Error('500 Internal Server Error');
      });
    } catch (e) {
      // error already handled in onSubmitError hook
    }
    submitBtn.disabled = false;
  });

  el.querySelector('#se-clear-log').addEventListener('click', () => {
    logEl.textContent = '(no events yet)';
    logCount = 0;
  });

  return form;
},

run(el) {
  const form = createForm({

      avatar:   [{ fileTypes: ['image/*'] }],
      document: [{ fileTypes: ['application/pdf', 'application/msword'] }],
    },
  });

  el.innerHTML = `

        <div style="margin-top:6px;display:flex;align-items:center;gap:8px;">

        <div style="margin-top:6px;display:flex;align-items:center;gap:8px;">
          <span id="ft-doc-mime" style="font-size:11px;color:var(--t2);font-family:monospace;"></span>

// ── Demo: focus / focusFirstError ────────────────────────────────────────────
{
title: 'focus / focusFirstError — Programmatic Focus',
desc: 'focus(path) focuses the element connected via form.connect(). focusFirstError() scans all error paths and focuses the first element in DOM document order. Both return false if no connected element is found.',
code: `const form = createForm({
  initialValues: { name: '', email: '' },
  rules: { name: 'required', email: ['required', 'email'] },
});

// Wire inputs to the form
const nameInput  = document.getElementById('name');
const emailInput = document.getElementById('email');
form.connect('name', nameInput);
form.connect('email', emailInput);

// Programmatic focus
form.focus('email');       // focuses emailInput directly
form.focusFirstError();    // after validation, focuses the first field with an error`,

run(el) {
  const form = createForm({
    initialValues: { name: '', email: '' },
    rules: { name: 'required', email: ['required', 'email'] },
  });

  el.innerHTML = `
    <div class="df">
      <div class="sec">Programmatic Focus via form.connect()</div>
      <div class="fld">
        <label>Name</label>
        <input id="ff-name" type="text" placeholder="Required field" />
        <div class="ferr" id="ff-name-err"></div>
      </div>
      <div class="fld">
        <label>Email</label>
        <input id="ff-email" type="text" placeholder="Required, must be valid email" />
        <div class="ferr" id="ff-email-err"></div>
      </div>
      <div class="btn-row" style="margin-bottom:14px;">
        <button class="btn sm" id="ff-focus-name">Focus name</button>
        <button class="btn sm" id="ff-focus-email">Focus email</button>
        <button class="btn primary" id="ff-val-focus">Validate + Focus First Error</button>
        <button class="btn" id="ff-reset">Reset</button>
      </div>
      <div style="background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:10px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);margin-bottom:4px;">Currently focused</div>
        <span class="badge b" id="ff-focused">none</span>
      </div>
    </div>`;

  const nameInput  = el.querySelector('#ff-name');
  const emailInput = el.querySelector('#ff-email');
  const focusedEl  = document.getElementById('ff-focused');

  // Connect inputs to the form
  form.connect('name',  nameInput);
  form.connect('email', emailInput);

  const updateFocused = (label) => {
    focusedEl.textContent = label;
    focusedEl.className = 'badge ' + (label === 'none' ? 'b' : 'g');
  };

  nameInput.addEventListener('focus',  () => updateFocused('name'));
  emailInput.addEventListener('focus', () => updateFocused('email'));
  nameInput.addEventListener('blur',   () => updateFocused('none'));
  emailInput.addEventListener('blur',  () => updateFocused('none'));

  nameInput.addEventListener('input',  e => form.set('name',  e.target.value, { touch: true }));
  emailInput.addEventListener('input', e => form.set('email', e.target.value, { touch: true }));

  const unsub = form.subscribe(state => {
    document.getElementById('ff-name-err').textContent  = state.errors.name  ?? '';
    document.getElementById('ff-email-err').textContent = state.errors.email ?? '';
  });

  el.querySelector('#ff-focus-name').addEventListener('click', () => {
    form.focus('name');
  });

  el.querySelector('#ff-focus-email').addEventListener('click', () => {
    form.focus('email');
  });

  el.querySelector('#ff-val-focus').addEventListener('click', async () => {
    await form.validate();
    const result = form.focusFirstError();
    if (result === false) updateFocused('none — no errors found');
  });

  el.querySelector('#ff-reset').addEventListener('click', () => {
    form.reset();
    nameInput.value  = '';
    emailInput.value = '';
    document.getElementById('ff-name-err').textContent  = '';
    document.getElementById('ff-email-err').textContent = '';
    updateFocused('none');
  });

  el._cleanup = () => unsub();
  return form;
},
},

{
title: 'Wildcard Dependency Graph',
desc: 'Use wildcard patterns like items.*.price in the dependency graph so that editing any array item\'s price automatically triggers validation of summary.total — without listing each index explicitly.',
code: `const form = createForm({
  initialValues: {
    items: [
      { name: 'Widget A', price: 10 },
      { name: 'Widget B', price: 20 },
    ],
    summary: { total: 0 },
  },
  dependencies: {
    'items.*.price': ['summary.total'],
  },
  validator(values) {
    const total = values.items.reduce((sum, item) => sum + Number(item.price), 0);
    const errors = {};
    if (total > 100) errors['summary.total'] = \`Total $\${total} exceeds $100 budget\`;
    return errors;
  },
});`,

run(el) {
  const form = createForm({
    initialValues: {
      items: [
        { name: 'Widget A', price: 10 },
        { name: 'Widget B', price: 20 },
      ],
      summary: { total: 0 },
    },
    dependencies: { 'items.*.price': ['summary.total'] },
    validator(values) {
      const total = (values.items || []).reduce((sum, item) => sum + Number(item.price || 0), 0);
      const errors = {};
      if (total > 100) errors['summary.total'] = `Total $${total} exceeds $100 budget`;
      return errors;
    },
  });

  el.innerHTML = `
    <div class="df">
      <div class="sec">Wildcard Dependency: items.*.price → summary.total</div>
      <div style="margin-bottom:10px;">
        <div style="display:grid;grid-template-columns:1fr 1fr 80px;gap:6px;margin-bottom:4px;">
          <span style="font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);">Item</span>
          <span style="font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);">Price</span>
          <span></span>
        </div>
        <div id="wd-items"></div>
      </div>
      <div class="btn-row" style="margin-bottom:12px;">
        <button class="btn primary" id="wd-add">+ Add item</button>
        <button class="btn" id="wd-reset">Reset</button>
      </div>
      <div style="background:var(--bg1);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;">
        <div style="font-size:10px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--t2);margin-bottom:4px;">summary.total validation</div>
        <span class="badge b" id="wd-total-status">—</span>
        <div class="ferr" id="wd-total-err" style="margin-top:6px;"></div>
      </div>
      <div class="sec">Validation log</div>
      <div class="box" id="wd-log" style="max-height:120px;font-size:11px;">(edit a price to see wildcard deps fire…)</div>
    </div>`;

  const log = el.querySelector('#wd-log');
  let logCount = 0;
  const addLog = (msg) => {
    logCount++;
    const line = `[${logCount}] ${msg}`;
    log.textContent = log.textContent.startsWith('(') ? line : log.textContent + '\n' + line;
    log.scrollTop = log.scrollHeight;
  };

  const renderItems = () => {
    const items = form.get('items') || [];
    const container = el.querySelector('#wd-items');
    container.innerHTML = '';
    items.forEach((item, i) => {
      const row = document.createElement('div');
      row.style.cssText = 'display:grid;grid-template-columns:1fr 1fr 80px;gap:6px;margin-bottom:6px;align-items:center;';
      row.innerHTML = `
        <input id="wd-name-${i}" type="text" value="${item.name}" placeholder="Item name" />
        <input id="wd-price-${i}" type="number" value="${item.price}" placeholder="0" min="0" />
        <button class="btn danger sm" id="wd-rm-${i}" style="padding:4px 8px;font-size:11px;">Remove</button>`;
      container.appendChild(row);

      el.querySelector(`#wd-name-${i}`).addEventListener('input', e => {
        form.set(`items.${i}.name`, e.target.value);
      });
      el.querySelector(`#wd-price-${i}`).addEventListener('input', async e => {
        form.set(`items.${i}.price`, Number(e.target.value));
        addLog(`items.${i}.price changed → validating with wildcard dep on summary.total`);
        await form.validate([`items.${i}.price`]);
      });
      el.querySelector(`#wd-rm-${i}`).addEventListener('click', () => {
        form.arrayRemove('items', i);
        renderItems();
        addLog(`item ${i} removed`);
      });
    });
  };

  const totalStatus = el.querySelector('#wd-total-status');
  const totalErr = el.querySelector('#wd-total-err');
  form.subscribe(state => {
    const err = state.errors['summary.total'];
    if (err) {
      totalStatus.textContent = '✗ over budget'; totalStatus.className = 'badge r';
      totalErr.textContent = err;
    } else {
      const valid = form.isFieldValid('summary.total');
      totalStatus.textContent = valid === true ? '✓ within budget' : '—';
      totalStatus.className = valid === true ? 'badge g' : 'badge b';
      totalErr.textContent = '';
    }
  });

  el.querySelector('#wd-add').addEventListener('click', () => {
    form.arrayAppend('items', { name: 'New item', price: 0 });
    renderItems();
  });
  el.querySelector('#wd-reset').addEventListener('click', () => {
    form.reset();
    renderItems();
    log.textContent = '(edit a price to see wildcard deps fire…)';
    logCount = 0;
  });

  renderItems();
  return form;
},
},

run(el) {

      <div class="sec">Console intercept</div>
      <div class="box" id="rpv-log" style="max-height:160px;font-size:11px;">(warnings will appear here — also check DevTools console)</div>

  const logEl = el.querySelector('#rpv-log');
  let warnCount = 0;

  const form = createForm({ initialValues: { email: '', address: { city: '' } } });

  el.querySelector('#rpv-city').addEventListener('input', e => form.set('address.city', e.target.value));

  });

  el._cleanup = () => { console.warn = origWarn; };

      </div>
      <div class="sec">Path subscriber map</div>
      <div class="box" id="p-paths" style="max-height:120px;"></div>
    </div>`;

  const refresh = () => {
    const p = form.perf;
    document.getElementById('p-n').textContent = p.notifications;
    document.getElementById('p-v').textContent = p.lastValidationMs !== null ? p.lastValidationMs.toFixed(1) : '—';
    document.getElementById('p-e').textContent = p.epoch;
    document.getElementById('p-s').textContent = p.subscriberCount;
    document.getElementById('p-paths').textContent = JSON.stringify(p.pathMap, null, 2) || '(none)';
  };

  form.subscribe(refresh);
  setInterval(refresh, 200);

  document.getElementById('add-subs').addEventListener('click', () => {
    for (let i = 0; i < 5; i++) globalUnsubs.push(form.subscribe(() => {}));
    for (let i = 0; i < FIELD_COUNT; i++) pathUnsubs.push(form.subscribeToPath('field' + i, () => {}));
    refresh();
  });

  document.getElementById('run-batch').addEventListener('click', () => {
    form.batch(() => {
      for (let i = 0; i < FIELD_COUNT; i++) form.set('field' + i, String(Math.random().toFixed(4)));

  });

  document.getElementById('run-async').addEventListener('click', () => {
    form.validate();
    refresh();

  document.getElementById('rm-subs').addEventListener('click', () => {
    globalUnsubs.forEach(u => u()); globalUnsubs.length = 0;
    pathUnsubs.forEach(u => u()); pathUnsubs.length = 0;

  });

  return form;
}
},

{
title: 'useField — Field Isolation',
desc: 'A per-field hook using subscribeToPath means only the component owning that field re-renders when its value changes. Other fields are unaffected.',
code: `function useField(form, path) {
  const [value, setValue] = useState(() => form.get(path));
  const [fieldState, setFieldState] = useState({});
  useEffect(() => {
    return form.subscribeToPath(path, (val, fs) => {
      setValue(val);
      setFieldState(fs);
    });
  }, [path]);
  const set = (v) => form.set(path, v, { touch: true, validate: true });
  return [value, fieldState, set];
}

// Now each input only re-renders when its own path changes
function EmailField({ form }) {
  const [value, { error, touched }, set] = useField(form, 'email');
  return (
    <>
      <input value={value} onChange={e => set(e.target.value)} />
      {touched && error && <span className="err">{error}</span>}
    </>
  );
}`,

function useWatch(form, paths) {
  const pathArray = Array.isArray(paths) ? paths : [paths];

// ─── APP STATE ────────────────────────────────────────────────────────────────

const FRAMEWORKS = [
  { key: 'vanilla', label: 'Vanilla JS', steps: VANILLA },
  { key: 'react',   label: 'React 18',   steps: REACT },
  { key: 'vue',     label: 'Vue 3',      steps: VUE },
  { key: 'solid',   label: 'SolidJS',    steps: SOLID },
  { key: 'svelte',  label: 'Svelte 4',   steps: SVELTE },
  { key: 'angular', label: 'Angular 19', steps: ANGULAR },
];

let currentFw = 'vanilla';
let currentIdx = 0;
let activeForm = null;
let perfInterval = null;

// ─── PERF PANEL ──────────────────────────────────────────────────────────────

function renderPerfPanel(form) {
  const pc = document.getElementById('perfContent');
  if (!form || !form.perf) { pc.innerHTML = ''; return; }
  const p = form.perf;
  const pathMap = p.pathMap || {};

  pc.innerHTML = `
    <div class="perf-row">
      <div class="perf-lbl">Notifications</div>
      <div class="perf-val" id="pn">${p.notifications}</div>
      <div class="perf-sub">total subscriber calls</div>
    </div>
    <div class="perf-row">
      <div class="perf-lbl">Last Validation</div>
      <div class="perf-val" id="pv">${p.lastValidationMs !== null ? p.lastValidationMs.toFixed(1) + 'ms' : '—'}</div>
      <div class="perf-sub">includes async debounce</div>
    </div>
    <div class="perf-row">
      <div class="perf-lbl">Async Epoch</div>
      <div class="perf-val" id="pe">${p.epoch}</div>
      <div class="perf-sub">increments per validation run</div>
    </div>
    <div class="perf-row">
      <div class="perf-lbl">Subscribers</div>
      <div class="perf-val" id="ps">${p.subscriberCount}</div>
      <div class="perf-sub">global + path listeners</div>
    </div>
    <div class="perf-row">
      <div class="perf-lbl">Batch Active</div>
      <div class="perf-val sm" id="pb" style="color:${p.batchActive ? 'var(--yellow)' : 'var(--green)'}">
        ${p.batchActive ? 'YES' : 'no'}
      </div>
    </div>
    <div style="padding:10px 12px;border-bottom:1px solid var(--border);">
      <div class="perf-lbl" style="margin-bottom:6px;">Path Subscribers</div>
      ${Object.keys(pathMap).length === 0 ? '<div style="font-size:11px;color:var(--t2);">(none yet)</div>' :
        Object.entries(pathMap).map(([path, count]) =>
          `<div class="perf-path-item"><span style="font-family:monospace;font-size:10px;color:var(--t1);">${path}</span><em>${count}</em></div>`
        ).join('')
      }
    </div>`;
}

function startPerfPolling(form) {
  stopPerfPolling();
  if (!form || !form.perf) return;
  perfInterval = setInterval(() => {
    const p = form.perf;
    const set = (id, val) => { const el = document.getElementById(id); if (el) el.textContent = val; };
    set('pn', p.notifications);
    set('pv', p.lastValidationMs !== null ? p.lastValidationMs.toFixed(1) + 'ms' : '—');
    set('pe', p.epoch);
    set('ps', p.subscriberCount);
    const pb = document.getElementById('pb');
    if (pb) {
      pb.textContent = p.batchActive ? 'YES' : 'no';
      pb.style.color = p.batchActive ? 'var(--yellow)' : 'var(--green)';
    }
  }, 150);
}

function stopPerfPolling() {
  if (perfInterval) { clearInterval(perfInterval); perfInterval = null; }
}

// ─── SIDEBAR ─────────────────────────────────────────────────────────────────

function renderSidebar() {
  const fw = FRAMEWORKS.find(f => f.key === currentFw);
  const sb = document.getElementById('sidebar');
  sb.innerHTML = `<div class="sidebar-label">${fw.label}</div>` +
    fw.steps.map((step, i) =>
      `<div class="step-item ${i === currentIdx ? 'active' : ''}" data-idx="${i}">
        <span class="step-num">${i + 1}</span>
        <span>${step.title}</span>
       </div>`
    ).join('');
  sb.querySelectorAll('.step-item').forEach(el => {
    el.addEventListener('click', () => navigate(currentFw, parseInt(el.dataset.idx)));
  });
}

// ─── CODE PANEL ──────────────────────────────────────────────────────────────

function renderCode(step) {
  document.getElementById('stepTitle').textContent = step.title;
  document.getElementById('stepDesc').textContent = step.desc;
  const codeEl = document.getElementById('codeEl');
  codeEl.textContent = step.code;
  delete codeEl.dataset.highlighted;
  hljs.highlightElement(codeEl);
}

// ─── DEMO AREA ───────────────────────────────────────────────────────────────

function renderDemo(step) {
  // Clean up previous
  if (activeForm && activeForm.destroy) activeForm.destroy();
  const demoArea = document.getElementById('demoArea');
  if (demoArea._cleanup) { demoArea._cleanup(); demoArea._cleanup = null; }
  demoArea.innerHTML = '';
  stopPerfPolling();

  const isVanilla = currentFw === 'vanilla';
  const hasSb = step.stackblitzUrl;
  const isCliOnly = step.cliOnly;
  const hasSbProject = !!step.stackblitzProject;

  if (isVanilla && step.run) {
    // Vanilla — run the demo directly
    document.getElementById('demoLabel').textContent = 'Demo';
    const perfPanel = document.getElementById('perfPanel');
    perfPanel.style.display = 'flex';
    document.getElementById('workspace').style.gridTemplateColumns =
      'var(--side) 1fr 1fr var(--perf)';

    try {
      // Auto-wrap createForm with withPerf so every vanilla step populates
      // the Engine Internals panel without each step having to opt in.
      createForm = (...a) => withPerf(_createForm(...a));
      activeForm = step.run(demoArea);
    } catch (err) {
      demoArea.innerHTML = `<div class="alert err">Error: ${err.message}</div>`;
    } finally {
      createForm = _createForm; // always restore
    }
    renderPerfPanel(activeForm);
    startPerfPolling(activeForm);
  } else if (step.iframeHtml) {
    // Framework — render in iframe
    document.getElementById('demoLabel').textContent = 'Live Demo';
    hidePerfPanel();

    const iframe = document.createElement('iframe');
    iframe.className = 'demo-iframe';
    iframe.style.flex = '1';
    iframe.srcdoc = step.iframeHtml;
    iframe.sandbox = 'allow-scripts allow-same-origin';
    demoArea.style.padding = '0';
    demoArea.style.display = 'flex';
    demoArea.style.flexDirection = 'column';
    demoArea.appendChild(iframe);
  } else if (hasSbProject) {
    // StackBlitz POST-based live demo
    document.getElementById('demoLabel').textContent = 'Run It';
    hidePerfPanel();
    demoArea.innerHTML = `
      <div style="max-width:380px;">
        <div class="alert info" style="font-size:13px;line-height:1.6;">
          This framework requires a build step. Click below to open a ready-to-run project in StackBlitz
          — all files are pre-configured, no setup needed.
        </div>
        <button id="sbLaunchBtn" class="sb-link" style="cursor:pointer;border:none;display:inline-block;margin-top:12px;">
          ↗ Open in StackBlitz
        </button>
      </div>`;
    document.getElementById('sbLaunchBtn').addEventListener('click', function() {
      openStackBlitz(step.stackblitzProject);
    });
  } else if (isCliOnly) {
    // Fallback — no live demo and no StackBlitz project defined
    document.getElementById('demoLabel').textContent = 'About';
    hidePerfPanel();
    demoArea.innerHTML = `
      <div style="max-width:420px;">
        <div class="alert info" style="font-size:13px;line-height:1.7;">
          This framework requires a compile step. The code on the left is correct and production-ready.
        </div>
      </div>`;
  } else if (hasSb) {
    // Code-only with StackBlitz link
    document.getElementById('demoLabel').textContent = 'Run It';
    hidePerfPanel();

    demoArea.innerHTML = `
      <div style="max-width:360px;">
        <div class="alert info" style="font-size:13px;line-height:1.6;">
          This framework requires a compile step. The code on the left is correct and production-ready.
          Open it in StackBlitz for a live, interactive demo.
        </div>
        <a class="sb-link" href="${step.stackblitzUrl}" target="_blank">
          ↗ Open in StackBlitz
        </a>
      </div>`;
  }
}

function hidePerfPanel() {
  const pp = document.getElementById('perfPanel');
  pp.style.display = 'none';
  document.getElementById('workspace').style.gridTemplateColumns = 'var(--side) 1fr 1fr';
}

// ─── FRAMEWORK TABS ──────────────────────────────────────────────────────────

function renderFwTabs() {
  const tabs = document.getElementById('fwTabs');
  tabs.innerHTML = FRAMEWORKS.map(fw =>
    `<button class="fw-tab ${fw.key === currentFw ? 'active' : ''}" data-fw="${fw.key}">
      ${fw.label}
     </button>`
  ).join('');
  tabs.querySelectorAll('.fw-tab').forEach(btn => {
    btn.addEventListener('click', () => navigate(btn.dataset.fw, 0));
  });
}

// ─── NAV FOOTER ──────────────────────────────────────────────────────────────

function renderNav() {
  const fw = FRAMEWORKS.find(f => f.key === currentFw);
  const total = fw.steps.length;
  document.getElementById('stepCtr').textContent = `${currentIdx + 1} / ${total}`;
  document.getElementById('prevBtn').disabled = currentIdx === 0;
  document.getElementById('nextBtn').disabled = currentIdx === total - 1;
}

// ─── ROUTER ──────────────────────────────────────────────────────────────────

function navigate(fw, idx, { pushState = true } = {}) {
  currentFw = fw;
  currentIdx = idx;
  const step = FRAMEWORKS.find(f => f.key === fw).steps[idx];

  renderFwTabs();
  renderSidebar();
  renderCode(step);
  renderDemo(step);
  renderNav();

  const lang = (fw === 'svelte' || fw === 'angular') ? fw : 'javascript';
  document.getElementById('codeLang').textContent = lang;

  if (pushState) {
    const url = new URL(window.location.href);
    url.searchParams.set('fw', fw);
    url.searchParams.set('step', idx);
    history.pushState(null, '', url.toString());
  }
}

window.addEventListener('popstate', () => {
  const params = new URLSearchParams(window.location.search);
  const fw  = params.get('fw')   || 'vanilla';
  const idx = parseInt(params.get('step') || '0', 10);
  const fwDef = FRAMEWORKS.find(f => f.key === fw);
  if (fwDef && idx >= 0 && idx < fwDef.steps.length) {
    navigate(fw, idx, { pushState: false });
  }
});

// ─── EVENT BINDINGS ──────────────────────────────────────────────────────────

document.getElementById('prevBtn').addEventListener('click', () => {
  if (currentIdx > 0) navigate(currentFw, currentIdx - 1);
});
document.getElementById('nextBtn').addEventListener('click', () => {
  const fw = FRAMEWORKS.find(f => f.key === currentFw);
  if (currentIdx < fw.steps.length - 1) navigate(currentFw, currentIdx + 1);
});

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') document.getElementById('nextBtn').click();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   document.getElementById('prevBtn').click();
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
(function initFromUrl() {
  const params = new URLSearchParams(window.location.search);
  const fw  = params.get('fw')   || 'vanilla';
  const idx = parseInt(params.get('step') || '0', 10);
  const fwDef = FRAMEWORKS.find(f => f.key === fw);
  const safeIdx = (fwDef && idx >= 0 && idx < fwDef.steps.length) ? idx : 0;
  navigate(fwDef ? fw : 'vanilla', safeIdx, { pushState: false });
})();
</script>
</body>
</html>
