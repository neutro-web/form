pre-commit:
  commands:
    format:
      glob: "packages/**/*.{ts,tsx}"
      run: pnpm exec biome check --write {staged_files}
      stage_fixed: true

pre-push:
  commands:
    lint:
      run: pnpm lint
    typecheck:
      run: pnpm exec tsc --noEmit
    typecheck-tests:
      run: pnpm typecheck
    build:
      run: pnpm build
    test:
      run: pnpm test
