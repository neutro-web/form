name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check all package versions match tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG_VERSION=${GITHUB_REF#refs/tags/v}
          FAILED=0
          for PKG in \
            packages/alias/package.json \
            packages/core/package.json \
            packages/adapters/react/package.json \
            packages/adapters/vue/package.json \
            packages/adapters/svelte/package.json \
            packages/adapters/solid/package.json \
            packages/adapters/angular/package.json \
            packages/testing/package.json \
            package.json; do
            PKG_VERSION=$(node -p "require('./$PKG').version")
            if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
              echo "❌ $PKG version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
              FAILED=1
            else
              echo "✅ $PKG @ $PKG_VERSION"
            fi
          done
          if [ "$FAILED" = "1" ]; then exit 1; fi

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm --filter "@neutro/*" run build

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: pnpm --filter @neutro/form publish --access public --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
