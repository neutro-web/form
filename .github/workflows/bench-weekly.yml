name: Bench Weekly

on:
  schedule:
    - cron: '0 2 * * 0'

permissions:
  contents: read
  issues: write

jobs:
  bench-weekly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: bench/pnpm-lock.yaml

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      # bench:bundle-size's neutro fixtures import @neutro/form-core and
      # @neutro/form (the alias package) by name, resolved via each package's
      # real dist/ output (gitignored, not committed) -- a fresh checkout has
      # no dist/ until something builds it. Skipping this step is what caused
      # the bundle-size ERROR regression: it silently recorded a build
      # failure as the published result instead of failing the job.
      - name: Build all packages
        run: pnpm build

      - run: pnpm --dir bench install --frozen-lockfile --ignore-workspace

      - run: pnpm --dir bench exec playwright install --with-deps chromium

      - run: pnpm --dir bench/apps/react install --ignore-workspace && pnpm --dir bench/apps/react build
      - run: pnpm --dir bench/apps/vue install --ignore-workspace && pnpm --dir bench/apps/vue build
      - run: pnpm --dir bench/apps/svelte install --ignore-workspace && pnpm --dir bench/apps/svelte build

      - run: pnpm --dir bench run bench:core
      - run: pnpm --dir bench run bench:correctness
      - run: pnpm --dir bench run bench:browser
      - run: pnpm --dir bench run bench:bundle-size
      - run: pnpm --dir bench run bench:merge

      - run: pnpm --dir bench run bench:post-drift
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
