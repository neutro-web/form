name: Bench Full

on:
  push:
    tags: ['v*']

concurrency:
  group: bench-full
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  bench-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v3
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: bench/pnpm-lock.yaml

      - run: pnpm --dir bench install --frozen-lockfile --ignore-workspace

      # Install Playwright browser binaries
      - run: pnpm --dir bench exec playwright install --with-deps chromium

      # Build browser apps first — fail clearly here, not inside Playwright
      - run: pnpm --dir bench/apps/react install --ignore-workspace && pnpm --dir bench/apps/react build
      - run: pnpm --dir bench/apps/vue install --ignore-workspace && pnpm --dir bench/apps/vue build
      - run: pnpm --dir bench/apps/svelte install --ignore-workspace && pnpm --dir bench/apps/svelte build

      - run: pnpm --dir bench run bench:core
      - run: pnpm --dir bench run bench:correctness
      - run: pnpm --dir bench run bench:browser
      - run: pnpm --dir bench run bench:bundle-size

      - run: pnpm --dir bench run bench:merge
        env:
          NEUTRO_VERSION: ${{ github.ref_name }}

      - run: pnpm --dir bench run bench:update-baseline
        env: { CI: true }

      - run: pnpm --dir bench run bench:generate

      # This job checks out the mutable `release` branch (not an immutable
      # tagged SHA) because it needs to push results back to it afterward.
      # If `release` moves during this multi-minute run (e.g. the next
      # cycle's fast-forward lands concurrently), the push below is a plain
      # `git push` with no --force, so a non-fast-forward is rejected rather
      # than silently overwritten — this fails loudly and needs a manual
      # re-run, but it never corrupts `release` or commits stale results.
      - name: Commit results to release
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bench/results/baseline.json docs/benchmarks/index.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: update benchmarks [skip ci]"
            git push origin release
          fi
