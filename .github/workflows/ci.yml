name: CI

on:
  push:
    branches: [main, release]
  pull_request:
    branches: [main, release]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Type check
        run: pnpm exec tsc --noEmit

      - name: Type check tests
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm --filter "@neutro/*" run build

  bench-apps-typecheck:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install root workspace dependencies
        run: pnpm install --frozen-lockfile

      # bench/apps/* link to these via link:../../../packages/* which resolves
      # through each package's dist/ output (main/types fields) — a fresh
      # checkout has no dist/ until something builds it, and this job's own
      # --ignore-workspace app installs never trigger that build themselves.
      - name: Build core + adapters consumed by bench apps
        run: pnpm --filter @neutro/form-core --filter @neutro/form-react --filter @neutro/form-vue --filter @neutro/form-svelte run build

      - name: Install and type check react app
        run: |
          pnpm --dir bench/apps/react install --frozen-lockfile --ignore-workspace
          pnpm --dir bench/apps/react run typecheck

      - name: Install and type check vue app
        run: |
          pnpm --dir bench/apps/vue install --frozen-lockfile --ignore-workspace
          pnpm --dir bench/apps/vue run typecheck

      - name: Install and type check svelte app
        run: |
          pnpm --dir bench/apps/svelte install --frozen-lockfile --ignore-workspace
          pnpm --dir bench/apps/svelte run typecheck
