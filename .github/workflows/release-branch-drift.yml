name: Release Branch Ancestry Check

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

# This check assumes the release->main merge-back PR (see CLAUDE.md's Release
# Flow, step 5) is always merged via a real merge commit — "Create a merge
# commit", never squash or rebase. Squash/rebase synthesizes a new SHA on
# main, so release's tip is no longer a literal ancestor of main even when
# the sync is correct, and this check would then fail permanently (a false
# positive) on an otherwise healthy repo.

permissions:
  contents: read

jobs:
  check-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify release is an ancestor of main
        run: |
          git fetch origin main release
          if git merge-base --is-ancestor origin/release origin/main; then
            echo "OK: release is an ancestor of main — no drift."
          else
            echo "::error::release has diverged from main — a post-release merge-back (see CLAUDE.md Release Flow) was likely skipped. Open a merge-back PR from release into main."
            exit 1
          fi
